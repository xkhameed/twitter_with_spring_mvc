<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Post List page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>




<div class="container py-4">
  <div class="row g-4">
    <div class="col-12 col-md-6 col-lg-4" th:each="post : ${posts}">
      <article class="card h-100 shadow-sm border-0">
        <div class="card-body d-flex flex-column">
          <h2 class="card-title h5 fw-bold" th:text="${post.title}">
          </h2>

          <p class="card-text text-secondary flex-grow-1"
             th:text="${post.content}">
          </p>

          <div class="d-flex align-items-center gap-2 mb-3">
            <span class="badge rounded-pill text-bg-light border">
              👁 <span th:text="${100}"></span>
            </span>
            <span class="badge rounded-pill text-bg-light border">
              ❤️ <span th:text="${10}"></span>
            </span>
          </div>

          <form th:action="@{/posts/{id}/like(id=${post.id})}" method="post">
            <button type="submit" class="btn btn-outline-danger w-100">
              ❤️ Like
            </button>
          </form>
        </div>
      </article>
    </div>
  </div>
</div>



</body>
</html>
