<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiqishni tasdiqlash - Library</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fb 0%, #e4e9f2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .logout-card {
            border: none;
            border-radius: 1.25rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            text-align: center;
            padding: 2.5rem 2rem;
        }
        .logout-icon {
            width: 75px;
            height: 75px;
            background: #fff3cd;
            color: #d97706;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.3rem;
            margin-bottom: 1.5rem;
        }
        .btn-confirm {
            background: #dc3545;
            border: none;
            border-radius: 0.75rem;
            padding: 0.7rem 1.5rem;
            font-weight: 600;
            color: white;
            transition: all 0.2s ease;
        }
        .btn-confirm:hover {
            background: #bb2d3b;
            color: white;
            transform: translateY(-1px);
        }
        .btn-cancel {
            border-radius: 0.75rem;
            padding: 0.7rem 1.5rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="logout-card">
    <div class="logout-icon">
        <i class="bi bi-box-arrow-right"></i>
    </div>

    <h4 class="fw-bold text-dark mb-2">Tizimdan chiqish</h4>
    <p class="text-secondary small mb-4">Haqiqatan ham o'z profilingizdan chiqmoqchimisiz?</p>

    <div class="d-flex gap-2 justify-content-center">
        <!-- Bekor qilish -->
        <a href="/" class="btn btn-light btn-cancel border flex-fill">
            <i class="bi bi-x-lg me-1"></i> Yo'q, qolish
        </a>

        <!-- Chiqish formasi -->
        <form method="POST" action="/logout" class="flex-fill">
            <input type="hidden" name="_csrf" th:value="${_csrf.getToken()}"/>
            <button type="submit" class="btn btn-confirm w-100">
                <i class="bi bi-check-lg me-1"></i> Ha, chiqish
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
